<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="git-state-url" content="/api/git" />
    <title>Cherry-pick example</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #172033; background: #f5f6f8; }
      body { max-width: 680px; margin: 64px auto; padding: 0 24px; }
      h1 { font-size: 28px; }
      h2 { font-size: 18px; }
      section { margin-top: 24px; padding: 20px; background: white; border: 1px solid #dfe3ea; border-radius: 12px; }
      dl { display: grid; grid-template-columns: 80px 1fr; gap: 12px; }
      dt, .hint { color: #596579; }
      dd { margin: 0; overflow-wrap: anywhere; }
      ul { padding-left: 24px; line-height: 2; }
      button { padding: 8px 16px; border: 1px solid #bcc4d0; border-radius: 6px; background: white; cursor: pointer; font: inherit; }
      button:focus-visible { outline: 3px solid #3169da; outline-offset: 3px; }
      output { display: inline-block; min-width: 48px; font-size: 28px; vertical-align: middle; }
      .hint { font-size: 14px; line-height: 1.6; }
    </style>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <h1>Cherry-pick example</h1>
    <section aria-labelledby="git-heading">
      <h2 id="git-heading">真实 Git 状态</h2>
      <dl>
        <dt>分支</dt><dd id="branch">读取中…</dd>
        <dt>HEAD</dt><dd id="head">读取中…</dd>
        <dt>最新提交</dt><dd id="subject">读取中…</dd>
        <dt id="state-label">工作区</dt><dd id="worktree">读取中…</dd>
      </dl>
      <p class="hint" id="git-note">切换分支或提交后刷新页面，以读取最新状态。</p>
    </section>
    <section aria-labelledby="content-heading">
      <h2 id="content-heading">当前版本包含的内容</h2>
      <ul id="features">
        <li>Base</li>
        <li>Commit A</li>
        <!-- Feature commits add Commit A, Commit B, and Commit C here. -->
      </ul>
    </section>
    <section aria-labelledby="counter-heading">
      <h2 id="counter-heading">Bug 演示</h2>
      <p>
        <output id="count" aria-label="当前计数" aria-live="polite">0</output>
        <button id="increment" type="button">+1</button>
        <button id="reset" type="button">重置</button>
      </p>
      <p class="hint">预期每次增加 1。实际增加 2 表示 bug 存在，增加 1 表示已经修复。</p>
    </section>
  </body>
</html>
